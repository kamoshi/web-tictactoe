server {  
  listen 8080;
  location / {  
    root        /usr/share/nginx/html;
    index       index.html index.htm;
    try_files   $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types      text/plain application/xml;
  gzip_proxied    no-cache no-store private expired auth;
  gzip_min_length 1000;
}
