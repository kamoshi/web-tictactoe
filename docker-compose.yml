version: "3.9"

services:
  frontend:
    build: ./frontend/
    image: kamov/tictactoe-frontend
    ports:
      - 8080:8080
  backend:
    build: ./backend/
    image: kamov/tictactoe-backend
    ports:
      - 7135:7135
    environment:
      - DB_CONNECTION_STRING=Host=database;Port=5432;Username=postgres;Password=postgres;Database=tictactoe
    networks:
      - tictactoe
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tictactoe
    ports:
      - 5432:5432
    networks:
      - tictactoe
    healthcheck:
      test: pg_isready -U postgres -d tictactoe
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  tictactoe:
    driver: bridge
