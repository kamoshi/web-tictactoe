version: "3.9"

services:
  frontend:
    build: ./frontend/
    image: kamov/tictactoe-frontend
    ports:
      - 4200:80
    links:
      - backend
  backend:
    build: ./backend/
    image: kamov/tictactoe-backend
    ports:
      - 7135:80
    environment:
      - DB_CONNECTION_STRING=Host=database;Port=5432;Username=postgres;Password=postgres;Database=tictactoe
    networks:
      - tictactoe
    depends_on:
      - database
  database:
    image: postgres:alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tictactoe
    ports:
      - 5432:5432
    networks:
      - tictactoe

networks:
  tictactoe:
    driver: bridge
